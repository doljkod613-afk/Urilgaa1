<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Урилгаа</title><link rel="stylesheet" href="/static/style.css"><body>
<header><b>💌 Урилгаа</b><nav><button onclick="show('home')">Нүүр</button><button onclick="show('dash')">Dashboard</button><button id="out" onclick="logout()">Гарах</button></nav></header><main>
<section id="home"><div class="hero"><span>✨ Бүх төрлийн цахим урилга</span><h1>Урилгаа хийх нь <i>амархан.</i></h1><p>Урилгаа үүсгээд, зочдоо өөрөө удирдаж, RSVP-гээ нэг дор хянаарай.</p><button class="primary" onclick="show('auth')">Эхлэх</button></div></section>
<section id="auth" class="hide"><div class="card narrow"><div><button onclick="mode='login';auth()">Нэвтрэх</button><button onclick="mode='reg';auth()">Бүртгүүлэх</button></div><div id="abox"></div></div></section>
<section id="dash" class="hide"><div class="row"><h2>Миний урилгууд</h2><button class="primary" onclick="newInv()">＋ Шинэ</button></div><div id="list" class="grid"></div></section>
<section id="edit" class="hide"><div class="row"><h2>Урилгаа засах</h2><button onclick="show('dash')">← Буцах</button></div><div class="two"><div class="card"><label>Гарчиг<input id="title"></label><label>Төрөл<select id="type"><option>birthday</option><option>wedding</option><option>graduation</option><option>party</option><option>event</option></select></label><label>Огноо<input id="date" type="date"></label><label>Цаг<input id="time" type="time"></label><label>Байршил<input id="venue"></label><label>Тайлбар<textarea id="message"></textarea></label><label>Загвар<select id="template"><option>classic</option><option>minimal</option><option>party</option></select></label><button class="primary" onclick="save()">Хадгалах</button></div><div class="card preview" id="preview"></div></div><div class="card"><div class="row"><h2>👥 Зочид</h2><button onclick="addGuest()">＋ Зочин</button></div><div id="gs"></div></div></section>
</main><script src="/static/app.js"></script></body></html>
