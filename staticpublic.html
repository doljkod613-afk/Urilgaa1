<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Урилга</title><link rel="stylesheet" href="/static/style.css"><main><div id="p" class="public"></div></main><script>
let s=location.pathname.split("/").pop();fetch("/api/public/"+s).then(r=>r.json()).then(x=>{document.title=x.title;p.innerHTML=`<span>💌 Цахим урилга</span><h1>${e(x.title)}</h1><p>${e(x.message||"Таныг хүрэлцэн ирэхийг урьж байна.")}</p><p>📅 ${e(x.date)}<br>⏰ ${e(x.time)}<br>📍 ${e(x.venue)}</p><hr><h2>RSVP</h2><input id=n placeholder="Таны нэр"><br><button onclick="r('yes')">Ирнэ</button><button onclick="r('maybe')">Магадгүй</button><button onclick="r('no')">Ирэхгүй</button><p id=m></p>`});function e(x){return String(x||"").replace(/[&<>"]/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[a]))}function r(v){fetch("/api/public/"+s+"/rsvp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.value,status:v})}).then(x=>x.json()).then(x=>m.textContent=x.ok?"Хариу бүртгэгдлээ 💖":x.error)}
</script></html>
