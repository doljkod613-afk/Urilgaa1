services:
  - type: web
    name: urilgaa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: urilgaa-db
          property: connectionString

databases:
  - name: urilgaa-db
    plan: free
